name: Deploy to GCE

on:
  workflow_run:
    workflows: ["Docker Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy via IAP tunnel
        uses: google-github-actions/ssh-compute@v1
        with:
          instance_name: scott-clawdbot
          zone: us-central1-b
          project_id: apex-internal-apps
          ssh_private_key: ${{ secrets.GCE_SSH_KEY }}
          command: |
            set -euo pipefail
            export GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}'
            export GHCR_USER='${{ secrets.GHCR_USER }}'
            sudo -u sbens --preserve-env=GHCR_TOKEN,GHCR_USER bash -euo pipefail << 'DEPLOY'
            DEPLOY_DIR="/home/sbens/clawdbot"
            cd "$DEPLOY_DIR"

            echo "==> Ensuring config ownership for container node user..."
            sudo chown -R 1000:1000 /home/sbens/.clawdbot/

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Pulling latest image from GHCR..."
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USER}" --password-stdin 2>/dev/null
            docker compose pull --quiet

            echo "==> Validating runtime config before deploy..."
            docker compose run --rm --no-deps clawdbot-gateway \
              node openclaw.mjs config validate 2>&1 || {
              echo "==> Config invalid — aborting deploy to keep bot running."
              exit 1
            }

            echo "==> Restarting container..."
            docker compose down
            docker compose up -d

            echo "==> Waiting for health check..."
            sleep 5
            if docker compose ps | grep -q "Up"; then
              echo "==> Deploy successful!"
              docker compose ps
            else
              echo "==> Deploy FAILED! Container not running."
              docker compose logs --tail=50
              exit 1
            fi
            DEPLOY
